name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Public repository contract
        run: pytest -q tests/test_public_repository_contract.py tests/test_client_pdf_script.py
      - name: Report generation smoke
        run: pytest -q tests/test_renderer.py::test_same_environment_render_is_byte_identical tests/test_synthetic_hotel_golden.py::test_synthetic_hotel_golden_audit_is_evidence_rich
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Strict mypy
        run: mypy src
      - name: Skill validation
        run: python scripts/validate_skill.py .
      - name: Public release scan
        run: python scripts/validate_public_release.py .
