rules:
  - rule_id: google-noindex-001
    vendor: google-search
    statement: A supported noindex robots directive tells Google not to show the page in search results when Google can crawl and read the directive.
    source_url: https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-08-11
    review_interval_days: 180
    confidence: 0.99
    scoring_weight: 1
  - rule_id: google-canonical-001
    vendor: google-search
    statement: rel=canonical is a strong canonicalization signal, while sitemap inclusion is a weaker signal.
    source_url: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-08-11
    review_interval_days: 180
    confidence: 0.99
    scoring_weight: 1
  - rule_id: google-ai-features-001
    vendor: google-search
    statement: Eligibility for Google Search AI features follows Google Search technical requirements; no special AI text file is required by this source.
    source_url: https://developers.google.com/search/docs/appearance/ai-features
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-08-11
    review_interval_days: 90
    confidence: 0.9
    scoring_weight: 0.5

  - rule_id: google-preview-controls-001
    vendor: google-search
    statement: Google-scoped nosnippet, max-snippet and data-nosnippet control preview use when crawlable; separate permissions and structured data can create exceptions.
    source_url: https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-11-09
    review_interval_days: 90
    confidence: 0.99
    scoring_weight: 0
  - rule_id: google-search-ai-control-001
    vendor: google-search
    statement: Search generative AI participation is an owner setting with include, exclude or inheritance; public crawling cannot prove the effective setting.
    source_url: https://support.google.com/webmasters/answer/16908024
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-11-09
    review_interval_days: 90
    confidence: 0.99
    scoring_weight: 0
  - rule_id: google-generative-report-001
    vendor: google-search
    statement: Generative AI impressions are separately reported in PT by text or multimodal search and property or page aggregation, overlap general Web and may contain exported unavailable values as zeros.
    source_url: https://support.google.com/webmasters/answer/16984139
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-11-09
    review_interval_days: 90
    confidence: 0.99
    scoring_weight: 0
  - rule_id: google-extended-001
    vendor: google-gemini
    statement: Google-Extended is a robots control token without a separate HTTP user agent and does not control inclusion or ranking in Google Search.
    source_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers#google-extended
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-11-09
    review_interval_days: 90
    confidence: 0.99
    scoring_weight: 0
  - rule_id: google-ai-features-002
    vendor: google-search
    statement: Google Search AI uses normal Search foundations plus owner participation controls; special chunking, AI markup, Markdown copies and llms.txt are not required and llms.txt is not used to improve Google Search visibility.
    source_url: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    source_type: official_vendor_documentation
    evidence_level: A
    verified_at: 2026-11-09
    review_interval_days: 90
    confidence: 0.99
    scoring_weight: 0
crawler_products:
  - identifier: google-search
    token: Googlebot
    vendor: google-search
    purpose: traditional_search
    control_type: robots_txt
    robots_txt_respected: true
    source_rule: robots-rfc9309-001
    verified_at: 2026-08-11
